name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  be-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run BE tests
        working-directory: BE
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

  be-build:
    needs: be-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build BE image
        working-directory: BE
        run: |
          ./gradlew assemble --no-daemon
          docker build -t transfer-be:${{ github.sha }} .

  fe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FE/transfermap/package-lock.json
      - name: Build FE
        working-directory: FE/transfermap
        run: |
          npm ci
          npm run build
