server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/transfer-map.pem;
    ssl_certificate_key /etc/nginx/ssl/transfer-map.key;

    location /api/ {
        proxy_pass http://be:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /sitemap-players.xml {
        proxy_pass http://be:8080/api/sitemap-players;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.xml$ {
        root /usr/share/nginx/html;
        default_type application/xml;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
